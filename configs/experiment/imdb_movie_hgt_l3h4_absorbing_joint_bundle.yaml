# @package _global_
defaults:
  - imdb_movie_hgt_l3h4_absorbing_posterior

general:
  name: imdb_movie_l3h4_absorbing_joint_bundle

model:
  # Learn whether two incident missing edges should be restored together from
  # PyHGT query representations. Training bundles come directly from random
  # deletion states; no triangle type or meta-path list is supplied.
  use_joint_edge_bundle: true
  joint_edge_bundle_hidden_dim: 128
  joint_edge_bundle_family_dim: 16
  joint_edge_bundle_loss_weight: 1.0
  joint_edge_bundle_warmup_epochs: 5
  joint_edge_bundle_t_power: 1.0
  joint_edge_bundle_max_positive_pairs: 2048
  joint_edge_bundle_negatives_per_positive: 2

  # During generation the learned bundle score is evaluated only against edges
  # already present in the generated state. Family-count intercept calibration
  # is applied afterwards, so the joint head changes allocation, not edge count.
  joint_edge_bundle_sampling_scale: 1.0
  joint_edge_bundle_sampling_candidates_per_node: 32
  joint_edge_bundle_sampling_context_per_node: 8
  absorbing_joint_refresh_rounds: 3
  sampling_queryfree_decode: false

  # Pair ranking is the primary non-additive objective. Keep PL weak as an
  # individual-edge anchor rather than letting it dominate again.
  family_set_ranking_loss_weight: 0.05

