# @package _global_
defaults:
  - imdb_movie_hgt_l3h4_family_set_absorbing

general:
  name: imdb_movie_l3h4_family_set_absorbing_v2

model:
  # EDGE++-style correction: only inactive regions are frozen. The complete
  # active-active subgraph is regenerated at each reverse step, so early edge
  # mistakes can be removed rather than consuming permanent graph capacity.
  sampling_absorbing_refinement_mode: edgepp_active
  sampling_absorbing_protect_existing: false
  sampling_absorbing_active_node_fraction: 0.25
  sampling_absorbing_active_final_all: true
  sampling_absorbing_degree_budget_strict: true

  # A bounded score shortlist keeps the family-wise degree-constrained greedy
  # selection practical while exact family volume remains mandatory.
  sampling_absorbing_degree_pool_multiplier: 32
