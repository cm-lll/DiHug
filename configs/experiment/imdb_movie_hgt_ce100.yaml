# @package _global_
defaults:
  - pubmed_hetero_xey_hgt_clean_pw20
  - override /dataset: imdb_movie_subgraphs

general:
  name: imdb_movie_hgt_ce100
  wandb: disabled
  gpus: 1
  run_test_after_train: true
  enable_test_sampling: true
  enable_val_sampling: false
  enable_val_pred_metrics: false
  test_variance: 1
  final_model_samples_to_generate: 1
  final_model_chains_to_save: 0
  test_sampling_full_steps: false
  sampling_skip: 10
  test_sampling_metrics_every: 1
  verbose_sampling: true
  log_sampling_triangle_trace: true

train:
  n_epochs: 100
  batch_size: 1
  save_model: true

model:
  # Standard CE/BCE objective: same IMDB HGT/block-query setup as combo100,
  # but without the extra structural losses.
  family_count_loss_weight: 0.0
  degree_pair_dist_loss_weight: 0.0
  closure_rank_loss_weight: 0.0
