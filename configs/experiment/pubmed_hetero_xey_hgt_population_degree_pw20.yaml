# @package _global_
defaults:
  - pubmed_hetero_xey_hgt_clean_pw20

general:
  name: pubmed_population_degree_pw20

model:
  # The 4-layer clean recipe reaches the 11GB local limit before this loss is
  # evaluated.  Use the established l3h4 structural-experiment footprint for
  # every member of this paired PubMed sweep, including its zero-weight control.
  n_layers: 3
  hidden_dims:
    dx: 128
    de: 64
    dy: 64
    n_head: 4
    dim_ffX: 256
    dim_ffE: 128
    dim_ffy: 128

  # PubMed is not assumed to share IMDB's degree-2 heterogeneous triangle
  # mechanism.  This is deliberately a conservative transfer test: preserve
  # only the type-level degree population, without any typed-wedge closure term.
  population_role_loss_weight: 0.005
  population_role_loss_warmup_epochs: 5
  population_role_loss_t_power: 1.0
  population_role_degree_cap: 12
  population_role_degree_temperature: 1.0
  population_role_degree_weight: 1.0
  population_role_wedge_weight: 0.0
  population_role_closure_weight: 0.0

  # Keep legacy clean-node-ID structural objectives disabled for this transfer.
  node_closure_dist_loss_weight: 0.0
  low_degree_closure_loss_weight: 0.0
  typed_root_neighbor_loss_weight: 0.0
  degree_role_dist_loss_weight: 0.0
  closure_anti_concentration_loss_weight: 0.0
  typed_rooted_signature_loss_weight: 0.0
