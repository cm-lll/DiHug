# @package _global_
defaults:
  - pubmed_hetero_xey_hgt_clean_pw20

general:
  name: dihug_pubmed1565_hgt_xey_learned_controller_pw20

train:
  n_epochs: 100

model:
  # Learn a bucket-level structural bias that is trained together with BCE and
  # the soft structure objectives. It is intentionally small: family + endpoint
  # degree-pair + common-neighbor bucket.
  use_learned_structure_controller: true
  learned_structure_controller_scale: 1.0
  learned_structure_controller_l2: 1.0e-4
  learned_structure_controller_common_bins: 4
  learned_structure_controller_use_family: true
  learned_structure_controller_use_common: true
  learned_structure_controller_use_degree_pair: true

  # Structure supervision for the controller. Keep BCE on, but let high-noise
  # steps see enough structure pressure to learn when to suppress/reward closure.
  family_count_loss_weight: 0.05
  family_count_loss_t_power: 1.0
  degree_pair_dist_loss_weight: 0.05
  degree_pair_dist_loss_type: js
  degree_pair_dist_loss_target: block
  degree_pair_dist_loss_t_power: 1.0
  closure_rank_loss_weight: 0.05
  closure_rank_loss_t_power: 1.0
  closure_rank_pairs_per_family: 2048

  # Keep heavy top-k train probe off; use final sampling and same-type logs.
  train_structure_probe_every_epochs: 0
