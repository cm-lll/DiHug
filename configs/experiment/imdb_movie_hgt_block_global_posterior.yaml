# @package _global_
defaults:
  - imdb_movie_hgt_l3h4_moment

general:
  name: imdb_movie_hgt_block_global_posterior

model:
  # Standard marginal D3PM forward process with the existing heterogeneous
  # block-query denoiser. No structure controller or exact-K projection.
  edge_diffusion_mode: marginal
  denoiser: graph_transformer
  exist_loss_type: ce
  exist_pos_weight: 1
  edge_exist_weight: 1.0
  edge_subtype_weight: 0.0
  family_count_loss_weight: 0.0
  degree_pair_dist_loss_weight: 0.0
  closure_rank_loss_weight: 0.0

  block_partition_mode: hetero_metis
  block_query: true
  block_query_full_block: true
  block_query_inter_fill: true
  block_query_include_uniform: false
  block_query_max_edges_per_family: 0
  query_include_all_positive_edges: false
  train_all_blocks_per_noise: true
  train_all_blocks_step_mode: sequential
  train_all_blocks_strict_count: true

  # All block views contribute posterior logits. Canonical edges are then
  # deduplicated by stable owner and sampled once globally.
  sampling_block_mode: type_template
  sampling_block_marginal_init: true
  sampling_block_template_init: false
  sampling_edge_selection: global_posterior_bernoulli
  sampling_use_reverse_posterior: true
  sampling_reverse_posterior_mix_weights: null
  sampling_reverse_posterior_mix_mode: full
  sampling_reverse_posterior_mix_scale: 1.0
  sampling_global_posterior_require_current_edge_coverage: true
  sampling_global_posterior_expected_density_calibration: true
