# @package _global_
defaults:
  - pubmed_hetero_xey_hgt_learned_controller_pw20

general:
  name: dihug_pubmed1565_hgt_xey_learned_limiter_pw20

model:
  # Keep this in the later stable PubMed/IMDB l3h4 footprint instead of the
  # heavier default 5-layer/8-head model.
  n_layers: 3
  hidden_dims:
    dx: 128
    de: 64
    dy: 64
    n_head: 4
    dim_ffX: 256
    dim_ffE: 128
    dim_ffy: 128

  # Edge-level learned bucket bias: learns which candidate families / degree
  # pairs / common-neighbor buckets should be promoted.
  use_learned_structure_controller: true

  # Graph-level learned target head: learns the structural targets used by
  # sampling-time budget/limiter/early-stop logic, so sampling does not need
  # manually supplied true-graph target numbers.
  use_learned_structure_targets: true
  learned_structure_target_loss_weight: 0.05
  learned_structure_target_triangle_weight: 1.0
  learned_structure_target_clustering_weight: 1.0
  learned_structure_target_lcc_weight: 1.0
  learned_structure_target_assortativity_weight: 1.0
  learned_structure_target_log: true
  sampling_structure_target_source: learned

  # Combo100-style learned budget brake.  The target value is read from the
  # learned target head, not from sampling_structure_budget_target_triangles.
  sampling_structure_budget_controller: true
  sampling_structure_budget_closure_weight: 5.0
  sampling_structure_budget_delta_clip: 4.0
  sampling_structure_budget_log_every: 1

  # Optional multi-metric guardrail; it also reads learned targets when enabled.
  sampling_structure_limiter: false
