# @package _global_
defaults:
  - imdb_movie_hgt_l3h4_moment

general:
  name: imdb_movie_l3h4_learned_limiter

model:
  # Edge-level learned bucket bias: learns candidate promotion/suppression from
  # family, endpoint degree-pair, and common-neighbor buckets.
  use_learned_structure_controller: true
  learned_structure_controller_scale: 1.0
  learned_structure_controller_l2: 1.0e-4
  learned_structure_controller_common_bins: 4
  learned_structure_controller_use_family: true
  learned_structure_controller_use_common: true
  learned_structure_controller_use_degree_pair: true

  # Graph-level learned targets used by sampling-time budget/limiter/early stop.
  use_learned_structure_targets: true
  learned_structure_target_loss_weight: 0.05
  learned_structure_target_triangle_weight: 1.0
  learned_structure_target_clustering_weight: 1.0
  learned_structure_target_lcc_weight: 1.0
  learned_structure_target_assortativity_weight: 1.0
  learned_structure_target_log: true
  sampling_structure_target_source: learned

  # Combo100-style learned budget brake.  Targets are read from the learned
  # target head rather than manually supplied real-graph values.
  sampling_structure_budget_controller: true
  sampling_structure_budget_closure_weight: 5.0
  sampling_structure_budget_delta_clip: 4.0
  sampling_structure_budget_log_every: 1
  sampling_structure_limiter: false

  # Keep structural supervision aligned with the current IMDB moment recipe,
  # with a mild closure-rank signal so the learned controller sees closure
  # ordering during training.
  closure_rank_loss_weight: 0.02
  closure_rank_loss_t_power: 1.0
  closure_rank_loss_warmup_epochs: 5
  closure_rank_pairs_per_family: 512
  closure_rank_common_neighbor_chunk_size: 4096
