# @package _global_
defaults:
  - pubmed_hetero_xey_hgt_population_degree_pw20

general:
  name: pubmed_population_degree_quota_pw20

model:
  # PubMed keeps the transferable degree-histogram-only objective while
  # evaluating it on the same query-local family quota surface as IMDB QPPR.
  population_role_projection_mode: soft_quota
  population_role_projection_temperature: 0.5
  population_role_projection_min_temperature: 0.1
  population_role_projection_anneal_epochs: 100
  population_role_projection_bisection_iters: 40
