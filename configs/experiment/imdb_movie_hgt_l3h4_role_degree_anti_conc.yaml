# @package _global_
defaults:
  - imdb_movie_hgt_l3h4_edge_support_closure

general:
  name: dihug_imdb_role_degree_anti_conc

model:
  # Keep the previously useful node/edge closure objectives, then add explicit
  # role-budget and anti-concentration supervision.
  degree_role_dist_loss_weight: 0.01
  degree_role_dist_loss_warmup_epochs: 5
  degree_role_dist_loss_t_power: 1.0
  degree_role_dist_degree_cap: 8

  closure_anti_concentration_loss_weight: 0.01
  closure_anti_concentration_loss_warmup_epochs: 5
  closure_anti_concentration_loss_t_power: 1.0
  closure_anti_concentration_degree_cap: 8
  closure_anti_concentration_max_degree: 0
  closure_anti_concentration_top_frac: 0.05
  closure_anti_concentration_slack: 1.05
  closure_anti_concentration_chunk_size: 2048

