# @package _global_
defaults:
  - pubmed_hetero_xey_hgt_clean_pw20

general:
  name: dihug_pubmed1565_hgt_sdstyle_ce_blockunit

train:
  n_epochs: 100

model:
  # Pure SparseDiff-style edge objective: unweighted multiclass CE over
  # no-edge / edge-subtype classes. Heterogeneous adaptations stay in the model,
  # but no positive-class reweighting or extra structural loss is used here.
  exist_loss_type: ce
  exist_pos_weight: 1
  edge_exist_weight: 1.0
  edge_subtype_weight: 0.0
  sampling_calibrate_exist_pos_weight: false

  edge_count_loss_weight: 0.0
  family_count_loss_weight: 0.0
  degree_pair_dist_loss_weight: 0.0
  closure_rank_loss_weight: 0.0
  closure_pos_loss_weight: 0.0
  family_role_loss_weight: 0.0
  use_learned_structure_controller: false

  # Block-unit training: each forced block contains its internal candidates and
  # receives extra inter-block candidates from the shared inter pool when its
  # internal full block is below the edge_fraction budget. Across all forced
  # blocks in one noisy graph, the shared pool cursor avoids repeatedly drawing
  # the same block-pair candidates.
  edge_fraction: 0.1
  block_query: true
  block_partition_mode: hetero_metis
  hetero_metis_relation_balance_power: 0.5
  hetero_metis_refine_degree_balance: true
  hetero_metis_refine_max_iter: 200
  block_query_full_block: true
  block_query_inter_fill: true
  block_query_include_uniform: false
  block_query_max_edges_per_family: 0
  train_block_unit_noising: false
  query_include_all_positive_edges: false
  train_all_blocks_per_noise: true
  train_all_blocks_step_mode: sequential
  train_all_blocks_shuffle: true
  train_all_blocks_count: 0
  train_all_blocks_strict_count: true

  # Sampling mirrors the block-query coverage and uses SD-style Bernoulli plus
  # reverse posterior. No exact-K or oracle structural controller is enabled.
  sampling_block_mode: type_template
  sampling_block_marginal_init: true
  sampling_block_template_init: false
  sampling_edge_selection: bernoulli
  sampling_use_reverse_posterior: true
  sampling_reverse_posterior_mix_weights: null
  sampling_reverse_posterior_mix_mode: full
  sampling_reverse_posterior_mix_scale: 1.0
  sampling_reverse_posterior_stochastic_steps: true
  sampling_structure_budget_controller: false
  sampling_structure_guidance_closure_weight: 0.0
  sampling_structure_guidance_connect_weight: 0.0
  sampling_structure_guidance_degree_pair_weight: 0.0
  sampling_structure_guidance_assort_weight: 0.0
