# @package _global_
defaults:
  - imdb_movie_hgt_l3h4_family_set_absorbing_v2

general:
  name: imdb_absorbing_checkpoint_structural_realizer

model:
  # Build a complete anonymous family-degree realization at the terminal step.
  # Role rows are shuffled within node type from checkpoint buffers; no true
  # edge membership is available to the sampler.
  # The terminal role graph is built exactly by the checkpoint realizer below;
  # running the older EDGE++ greedy role pass first would be redundant.
  sampling_absorbing_refinement_mode: monotone
  sampling_absorbing_protect_existing: false
  sampling_absorbing_active_final_all: true
  sampling_absorbing_expand_active_for_capacity: true
  sampling_absorbing_degree_budget_strict: true

  # Replace the old one-add/one-drop boundary limiter with final-only 2-switch
  # realization. The 2-switch preserves every node's family-degree vector and
  # exact family counts while optimizing checkpointed global structure.
  sampling_structure_swap_limiter: false
  sampling_checkpoint_structural_realizer: true
  sampling_checkpoint_structural_realizer_final_only: true
  sampling_checkpoint_structural_realizer_initialize_family_degrees: true
  sampling_checkpoint_structural_realizer_max_swaps: 8192
  sampling_checkpoint_structural_realizer_max_proposals: 750000
  sampling_checkpoint_structural_realizer_targeted_probability: 0.90
  sampling_checkpoint_structural_realizer_triangle_weight: 1.0
  sampling_checkpoint_structural_realizer_clustering_weight: 5.0
  sampling_checkpoint_structural_realizer_lcc_weight: 2.0
  sampling_checkpoint_structural_realizer_assort_weight: 0.1
  sampling_checkpoint_structural_realizer_model_score_weight: 0.0
  sampling_checkpoint_structural_realizer_triangle_tolerance: 0.05
  sampling_checkpoint_structural_realizer_clustering_tolerance: 0.05
  sampling_checkpoint_structural_realizer_lcc_tolerance: 0.05
  sampling_checkpoint_structural_realizer_assort_tolerance: 0.20
  sampling_checkpoint_structural_realizer_log_every: 100

  sampling_structure_target_source: checkpoint_only
  sampling_budget_controller_enabled: false
  sampling_triangle_budget_enabled: false
  sampling_structure_guidance: false
