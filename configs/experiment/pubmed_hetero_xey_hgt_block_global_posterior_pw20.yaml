# @package _global_
defaults:
  - pubmed_hetero_xey_hgt_sdstyle_ce_blockunit

general:
  name: pubmed_hgt_block_global_posterior

model:
  edge_diffusion_mode: marginal
  sampling_block_mode: type_template
  sampling_block_marginal_init: true
  sampling_block_template_init: false
  sampling_edge_selection: global_posterior_bernoulli
  sampling_use_reverse_posterior: true
  sampling_reverse_posterior_mix_weights: null
  sampling_reverse_posterior_mix_mode: full
  sampling_reverse_posterior_mix_scale: 1.0
  sampling_global_posterior_require_current_edge_coverage: true
  sampling_global_posterior_expected_density_calibration: true
