# @package _global_
defaults:
  - imdb_movie_hgt_l3h4_learned_limiter

general:
  name: imdb_movie_l3h4_closure_bucket

model:
  # Match closure contribution distribution across relation families and
  # endpoint clean-degree buckets. This teaches the model that IMDB triangles
  # should be distributed over many low-degree local closures instead of being
  # concentrated around a few high-degree endpoints.
  closure_bucket_dist_loss_weight: 0.02
  closure_bucket_dist_loss_warmup_epochs: 5
  closure_bucket_dist_loss_t_power: 1.0
  closure_bucket_dist_loss_type: js
  closure_bucket_dist_min_query_edges: 16
  closure_bucket_dist_target_smoothing: 0.0
  closure_bucket_dist_score_log1p: false
  closure_bucket_dist_common_cap: 2.0
