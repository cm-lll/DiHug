# @package _global_
defaults:
  - imdb_movie_hgt_l3h4_moment

general:
  name: imdb_movie_l3h4_population_role

model:
  # This objective is population-level: it does not bind a clean degree-2
  # role, neighbor pair, or closure to the same node index at generation time.
  population_role_loss_weight: 0.03
  population_role_loss_warmup_epochs: 5
  population_role_loss_t_power: 1.0
  population_role_degree_cap: 6
  population_role_degree_temperature: 0.75
  population_role_degree_weight: 1.0
  population_role_wedge_weight: 0.5
  population_role_closure_weight: 1.0
  population_role_min_target_mass: 1.0
  population_role_require_target_closure: true

  # Keep this ablation free of clean-node-ID structural targets.
  node_closure_dist_loss_weight: 0.0
  low_degree_closure_loss_weight: 0.0
  typed_root_neighbor_loss_weight: 0.0
  degree_role_dist_loss_weight: 0.0
  closure_anti_concentration_loss_weight: 0.0
  typed_rooted_signature_loss_weight: 0.0
  closure_rank_loss_weight: 0.0
