# @package _global_
defaults:
  - pubmed_hetero_xey_hgt_learned_limiter_pw20

general:
  name: dihug_pubmed1565_hgt_xey_closure_bucket_pw20

model:
  # Same objective as the IMDB variant, kept generic and dataset-agnostic. On
  # PubMed it should act as a local-closure role regularizer rather than an IMDB
  # special case.
  closure_bucket_dist_loss_weight: 0.02
  closure_bucket_dist_loss_warmup_epochs: 5
  closure_bucket_dist_loss_t_power: 1.0
  closure_bucket_dist_loss_type: js
  closure_bucket_dist_min_query_edges: 32
  closure_bucket_dist_target_smoothing: 0.0
  closure_bucket_dist_score_log1p: false
  closure_bucket_dist_common_cap: 4.0
