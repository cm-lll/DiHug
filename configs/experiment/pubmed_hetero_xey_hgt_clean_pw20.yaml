# @package _global_
defaults:
  - pubmed_baseline_single_train

general:
  name: dihug_pubmed1565_hgt_xey_clean_pw20

train:
  n_epochs: 100
  batch_size: 1
  save_model: true

model:
  # Main DiHuG denoiser: sparse X/E/y transformer with HGT-style hetero node
  # message passing and family-specific edge-state updates.
  denoiser: graph_transformer
  edge_only_model: false
  output_y: false

  # Fixed coarse node types; this run repairs heterogeneous edges only.
  fix_node_output_types: true

  # Heterogeneous message passing.
  use_type_modulation: true
  use_family_film: true
  use_relation_attention_matrix: true
  use_relation_message_matrix: true
  use_relation_pri: true

  # HGT-style post-attention tails:
  # X: weighted_V -> G-FiLM -> GELU -> A-Linear[type] -> gated residual -> type LN
  # E: E-FiLM(QK) -> G-FiLM -> GELU -> A-Linear[family] -> gated residual -> family LN
  use_hgt_node_update: true
  use_hgt_edge_update: true

  # Hierarchical G condition. family_y is fused after attention, not before
  # E->attention FiLM, to avoid double-conditioning the same signal.
  use_sparse_hetero_y: true
  use_sparse_family_y: true
  sparse_family_y_degree_bins: 5
  use_family_y_film: true
  use_family_y_in_edge_film: true
  use_family_y_in_node_film: true

  # Query/block-local structural features are consumed inside the edge update layer.
  use_edge_struct_features: true
  edge_struct_feature_dim: 8

  # Full block-query training. A clean block template is built from the real graph;
  # each noisy graph reuses those node blocks as query chunks.
  edge_fraction: 0.1
  block_query: true
  block_partition_mode: hetero_metis
  hetero_metis_relation_balance_power: 0.5
  hetero_metis_refine_degree_balance: true
  hetero_metis_refine_max_iter: 200
  block_query_full_block: true
  block_query_inter_fill: true
  block_query_include_uniform: false
  block_query_max_edges_per_family: 0
  query_block_train_mode: none
  query_include_all_positive_edges: false
  train_all_blocks_per_noise: true
  train_all_blocks_step_mode: sequential
  train_all_blocks_shuffle: true
  train_all_blocks_count: 0
  train_all_blocks_strict_count: true

  # Sampling mirrors block-query coverage but initializes from full-graph marginals.
  sampling_block_mode: type_template
  sampling_block_template_init: false
  sampling_block_marginal_init: false
  sampling_edge_selection: gumbel_exact_k_degree_pair
  sampling_degree_pair_strength: 0.15
  sampling_gumbel_temperature: 0.01
  sampling_calibrate_exist_pos_weight: true
  sampling_use_reverse_posterior: true
  sampling_reverse_posterior_mix_weights: null
  sampling_reverse_posterior_mix_mode: alpha_bar_s
  sampling_reverse_posterior_mix_scale: 0.2

  # Train objective. Set the three structural weights in experiments; they are
  # logged together with BCE so 50ep/100ep stability can be judged structurally.
  exist_loss_type: bce
  exist_pos_weight: 20
  edge_exist_weight: 1.0
  edge_subtype_weight: 1.2
  edge_count_loss_weight: 0.0
  family_count_loss_weight: 0.0
  degree_pair_dist_loss_weight: 0.0
  degree_pair_dist_target: block
  closure_rank_loss_weight: 0.0
  closure_rank_pairs_per_family: 2048
  closure_rank_common_neighbor_chunk_size: 65536

  # Heavy training-time top-k probe can OOM while the autograd graph is resident.
  # Use final sampling logs and same-type internal metrics for structure diagnosis.
  train_structure_probe_every_epochs: 0
  train_structure_probe_min_query_edges: 256
