# @package _global_
defaults:
  - pubmed_hetero_xey_hgt_role_degree_anti_conc_pw20

general:
  name: dihug_pubmed1565_hgt_xey_adaptive_role_closure_pw20

model:
  # Same adaptive mechanism as IMDB, with conservative weights for PubMed. The
  # clean target decides whether closure should be distributed or concentrated;
  # no node type or dataset-specific motif is hard-coded here.
  node_closure_dist_loss_weight: 0.0
  node_closure_dist_include_endpoints: true
  node_closure_dist_mass_weight: 0.25
  node_closure_dist_second_moment_weight: 0.25
  node_closure_dist_top_weight: 0.20
  node_closure_dist_chunk_size: 512

  low_degree_closure_loss_weight: 0.005
  low_degree_closure_include_endpoints: true
  low_degree_closure_role_mode: adaptive
  low_degree_closure_max_degree: 3
  low_degree_closure_degree_cap: 12
  low_degree_closure_saturation_scale: 1.0
  low_degree_closure_fraction_weight: 1.0
  low_degree_closure_bce_weight: 0.75
  low_degree_closure_chunk_size: 128

  degree_role_dist_loss_weight: 0.006

  node_role_coverage_rank_loss_weight: 0.01
  node_role_coverage_rank_loss_warmup_epochs: 5
  node_role_coverage_rank_loss_t_power: 0.0
  node_role_coverage_rank_pairs_per_family: 512
  node_role_coverage_rank_min_query_edges: 32
  node_role_coverage_rank_include_endpoints: true
  node_role_coverage_rank_role_gate: adaptive
  node_role_coverage_rank_closure_mode: adaptive
  node_role_coverage_rank_common_cap: 2.0
  node_role_coverage_rank_common_neighbor_chunk_size: 512
  node_role_coverage_rank_degree_weight: 0.15
  node_role_coverage_rank_closure_weight: 0.8

  closure_rank_common_neighbor_chunk_size: 2048

  closure_anti_concentration_loss_weight: 0.0
  closure_anti_concentration_include_endpoints: true
  closure_anti_concentration_top_frac: 0.05
  closure_anti_concentration_slack: 1.10
  closure_anti_concentration_chunk_size: 256

  sampling_node_role_budget_controller: true
  sampling_node_role_budget_role_gate: adaptive
  sampling_node_role_budget_closure_mode: adaptive
  sampling_node_role_budget_degree_weight: 0.20
  sampling_node_role_budget_closure_weight: 1.00
  sampling_node_role_budget_over_penalty: 0.25
  sampling_node_role_budget_closure_unit_target_max: 1.0
  sampling_node_role_budget_diag: true
  sampling_node_role_budget_diag_log_every: 10
  sampling_node_role_budget_repair: true
  sampling_node_role_budget_repair_max_swaps: 64
  sampling_node_role_budget_repair_pair_top_adds: 64
  sampling_node_role_budget_repair_pair_top_drops: 64
  sampling_node_role_budget_repair_max_pool_per_family: 256
  sampling_node_role_budget_repair_role_gain_weight: 1.0
  sampling_node_role_budget_repair_model_score_weight: 0.20
  sampling_node_role_budget_repair_score_margin: 2.0
  sampling_node_role_budget_repair_protect_bridges: true
  sampling_node_role_budget_log_every: 1
